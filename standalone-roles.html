<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Roles - Interview Preparation</title>
    <!-- Using Google Fonts for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-yellow: #fbbf24;
            --tag-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
        }

        .container {
            max-w-width: 1200px;
            margin: 0 auto;
            max-width: 1200px;
        }

        /* Header section */
        .header {
            margin-bottom: 2rem;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .header-content h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Search input */
        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1.25rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Role Card */
        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            border-color: var(--primary);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .icon-wrapper {
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            padding: 0.6rem;
            border-radius: 0.75rem;
        }

        .bookmark-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--border-color);
            transition: all 0.2s;
            font-size: 1.5rem;
        }
        
        .bookmark-btn:hover {
            color: var(--accent-yellow);
        }

        .bookmark-btn.saved {
            color: var(--accent-yellow);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .card-department {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .skills-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .skill-tag {
            background: var(--tag-bg);
            color: var(--text-muted);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .question-count {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--tag-bg);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
        }

        .view-details {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .view-details:hover {
            opacity: 0.8;
        }

        /* Modal / Dialog */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            border-radius: 1rem;
            width: 90%;
            max-width: 600px;
            padding: 2rem;
            transform: scale(0.95) translateY(20px);
            transition: all 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .close-modal {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .modal-body h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            margin-top: 1.5rem;
            color: var(--text-main);
        }

        .modal-body p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border-radius: 1rem;
            border: 2px dashed var(--border-color);
            grid-column: 1 / -1;
        }

        .empty-state h3 {
            margin-bottom: 0.5rem;
        }
        
        .empty-state p {
            color: var(--text-muted);
        }
        
        .question-display-container {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 2px solid var(--border-color);
        }

        .session-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            text-align: center;
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .question-card {
            background: white;
            border-radius: 1.5rem;
            padding: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        .question-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .q-number {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 0.5rem;
        }

        .q-difficulty {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .q-content {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .loading-state, .error-state {
            text-align: center;
            padding: 3rem;
            background: rgba(79, 70, 229, 0.05);
            border-radius: 1.5rem;
            font-weight: 600;
        }

        .error-state {
            background: rgba(239, 68, 68, 0.05);
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ... existing header ... -->
        <div class="header">
            <div class="header-content">
                <h1>Explore Roles</h1>
                <p>Find the perfect role to practice for your next interview</p>
            </div>
            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search for roles...">
            </div>
        </div>

        <div class="filters" id="filtersContainer">
            <button class="filter-btn active" data-category="All">All</button>
            <button class="filter-btn" data-category="Tech">Tech</button>
            <button class="filter-btn" data-category="Non-Tech">Non-Tech</button>
            <button class="filter-btn" data-category="Startup">Startup</button>
            <button class="filter-btn" data-category="Bookmarks">★ Bookmarked</button>
        </div>

        <div class="grid" id="rolesGrid">
            <!-- Cards will be injected here via JavaScript -->
        </div>

        <!-- Question display container will be appended here by script.js -->
    </div>

    <!-- Modal ... existing ... -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-modal" id="closeModal">&times;</button>
            <div class="modal-header">
                <div class="icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h2 class="modal-title" id="modalTitle">Role Title</h2>
                    <div class="card-department" id="modalDept" style="margin-bottom: 0; margin-top: 5px;">Department</div>
                </div>
            </div>
            <div class="modal-body">
                <h4>Role Overview</h4>
                <p id="modalDesc">Description goes here.</p>
                
                <h4>Key Skills</h4>
                <div class="skills-container" id="modalSkills">
                    <!-- Skills injected here -->
                </div>

                <div style="background: var(--tag-bg); padding: 1rem; border-radius: 0.5rem; margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <span style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted);">Practice Mode</span>
                        <div style="font-weight: 700; font-size: 1.1rem; color: var(--text-main);"><span id="modalCount">0</span> Questions</div>
                    </div>
                    <button class="filter-btn active" style="margin: 0;" onclick="loadQuestions(document.getElementById('modalTitle').textContent.split(' ')[0])">Start Practice</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Move script logic to script.js -->

        const rolesData = [

            { id: 4, title: 'Frontend Developer', dept: 'IT / Software', cat: 'Tech', desc: 'Build responsive and interactive user interfaces.', skills: ['React', 'CSS', 'JS'], qt: 52 },
            { id: 5, title: 'Backend Developer', dept: 'IT / Software', cat: 'Tech', desc: 'Create server-side logic and database schemas.', skills: ['Node.js', 'SQL', 'APIs'], qt: 38 }
        ];
    </script>
    <script src="script.js"></script>
</body>
</html>
